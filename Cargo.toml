[workspace]
resolver = "2"
members = [
    "crates/ultranet-core",
    "crates/ultranet-node",
    "crates/ultranet-rendezvous",
    "crates/ultranet-transport",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
authors = ["The Ultranet Authors"]
rust-version = "1.88"
repository = ""
description = "Ultranet — sovereign anonymous network with trustless compute."

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Relaxed pedantic lints that fight with readable code:
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
