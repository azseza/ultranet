[package]
name = "ultranet-node"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Ultranet node binary. Composes all layers into a single runnable process."

[lints]
workspace = true

[[bin]]
name = "ultranet"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
ultranet-core = { path = "../ultranet-core" }
ultranet-rendezvous = { path = "../ultranet-rendezvous" }
ultranet-transport = { path = "../ultranet-transport" }
